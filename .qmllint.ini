; qmllint settings for this shell. Run it through scripts/lint.sh, which knows
; how to make the `qs.*` imports resolvable and which findings are noise.
;
; Nothing is demoted here on purpose. An earlier version of this file demoted
; whole categories (MissingProperty, MissingType, UnresolvedType, …) to `info`
; so the build would stay green — which also meant a *real* missing property
; anywhere in the shell would have been silently downgraded to a line of chatter
; nobody reads. Every category stays fatal; scripts/lint.sh instead suppresses
; an explicit list of individual known-unfixable findings, each with a reason.
; A new finding of any category fails the run.

[General]
DisableDefaultImports=false
IgnoreWarnings=

[Warnings]
UnusedImports=warning
